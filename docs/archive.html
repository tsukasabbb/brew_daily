<style>
  :root {
    --amber:#C8860A; --amber2:#F5A623;
    --ink:#0F0C08; --ink2:#3D2B1F; --muted:#7A6A5A;
    --paper:#F9F6F0; --card:#fff; --rule:#D4C4A8; --blue:#1A4E8C;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html{font-size:16px;}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--ink); color:#fff;
    padding:2rem 1.5rem 1.5rem; text-align:center;
    position:relative; overflow:hidden;
  }
  header::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(200,134,10,.07) 0,rgba(200,134,10,.07) 1px,transparent 1px,transparent 60px);
    pointer-events:none;
  }
  .eyebrow{font-size:.6rem;letter-spacing:.35em;color:var(--amber2);text-transform:uppercase;margin-bottom:.7rem;}
  h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(2rem,6vw,3.5rem);font-weight:900;
    color:#fff; letter-spacing:.06em; line-height:1;
  }
  .rule{
    border:none;height:1px;
    background:linear-gradient(90deg,transparent,var(--amber),transparent);
    margin:.8rem auto; width:min(360px,70%);
  }
  .subtitle{font-size:.7rem;color:rgba(255,255,255,.45);letter-spacing:.08em;}

  main{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
  .section-label{
    font-size:.62rem;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:var(--amber);
    border-bottom:1px solid var(--rule);padding-bottom:.5rem;
    margin-bottom:1.5rem;display:flex;align-items:center;gap:.5rem;
  }
  .section-label::before{content:'';display:block;width:14px;height:2px;background:var(--amber);}

  ul{list-style:none;}
  li+li{border-top:1px solid var(--rule);}
  li a{
    display:flex;align-items:center;gap:.8rem;
    padding:.9rem .5rem;
    color:var(--ink2);text-decoration:none;
    font-size:.88rem;font-weight:500;
    transition:background .15s, padding-left .15s;
  }
  li a:hover{
    background:#fff;padding-left:1rem;
    color:var(--ink);
  }
  li a .icon{font-size:1rem;flex-shrink:0;}
  li a .label{flex:1;}
  li a::after{content:'→';color:var(--amber);opacity:0;transition:opacity .15s;}
  li a:hover::after{opacity:1;}
  li.empty{padding:.9rem .5rem;color:var(--muted);font-size:.85rem;}

  .back{
    margin-top:2rem;
    font-size:.8rem;
  }
  .back a{
    color:var(--blue);text-decoration:none;
    border-bottom:1px solid currentColor;padding-bottom:1px;
  }
  .back a:hover{color:var(--amber);}

  footer{
    background:var(--ink);color:rgba(255,255,255,.3);
    text-align:center;padding:1.5rem;
    font-size:.68rem;line-height:1.8;
  }
  footer strong{color:var(--amber2);}
  @media(max-width:480px){
    main{padding:1.5rem 1rem 3rem;}
  }
</style>
