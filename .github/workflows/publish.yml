name: 🍺 BREW DAILY 毎朝自動発行

on:
  schedule:
    - cron: '0 22 * * *'  # 日本時間 毎朝7時 (UTC 22:00)
  workflow_dispatch:       # 手動実行ボタンも有効化
    inputs:
      full_regen:
        description: '記事をPythonで自動収集し直す（Claude確認済みの内容を使わない・非推奨）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install anthropic

      # 通常運用: Claudeが事前にWebSearch/WebFetchで一次情報を検証し、
      # docs/index.html に用意しておいた号を、そのままメール配信するだけ。
      # 記事の自動収集・自動生成は行わない（内容の正確性が保証できないため）。
      - name: 📬 準備済みの号をメール配信（通常運用）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_regen != true }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: python brew_magazine.py --mail-only

      # 緊急フォールバック: Actionsタブから手動実行し、full_regen にチェックを入れた
      # 場合のみ、従来どおりPythonが記事を自動収集・生成してメール配信する。
      - name: 🍺 記事を自動収集して生成・メール配信（手動・非推奨）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regen == true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          mkdir -p docs
          python brew_magazine.py
          cp output/latest.html docs/index.html

      - name: 静的ページをコピー
        run: |
          cp subscribe.html docs/subscribe.html
          cp admin.html docs/admin.html

      - name: 過去の号をアーカイブ
        run: |
          mkdir -p docs/archive
          cp output/brew_daily_*.html docs/archive/ 2>/dev/null || true

      - name: アーカイブ一覧ページを生成
        run: python generate_archive.py

      - name: GitHub Pages へデプロイ
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "🍺 ${{ github.run_id }} BREW DAILY 自動更新"
